<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 700" font-family="'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00b8d4"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#00c853"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d500f9"/>
      <stop offset="100%" stop-color="#aa00ff"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9100"/>
      <stop offset="100%" stop-color="#ff6d00"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="100%" stop-color="#d50000"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-heavy">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#00e5ff" opacity="0.7"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#00e676" opacity="0.7"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d500f9" opacity="0.7"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ff9100" opacity="0.7"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ff1744" opacity="0.7"/>
    </marker>
  </defs>

  <rect width="940" height="700" fill="url(#bg)"/>

  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="0.5">
    <line x1="0" y1="50" x2="940" y2="50"/><line x1="0" y1="100" x2="940" y2="100"/>
    <line x1="0" y1="150" x2="940" y2="150"/><line x1="0" y1="200" x2="940" y2="200"/>
    <line x1="0" y1="250" x2="940" y2="250"/><line x1="0" y1="300" x2="940" y2="300"/>
    <line x1="0" y1="350" x2="940" y2="350"/><line x1="0" y1="400" x2="940" y2="400"/>
    <line x1="0" y1="450" x2="940" y2="450"/><line x1="0" y1="500" x2="940" y2="500"/>
    <line x1="0" y1="550" x2="940" y2="550"/><line x1="0" y1="600" x2="940" y2="600"/>
    <line x1="0" y1="650" x2="940" y2="650"/>
    <line x1="100" y1="0" x2="100" y2="700"/><line x1="300" y1="0" x2="300" y2="700"/>
    <line x1="500" y1="0" x2="500" y2="700"/><line x1="700" y1="0" x2="700" y2="700"/>
  </g>

  <!-- Title -->
  <text x="470" y="38" text-anchor="middle" fill="#00e5ff" font-size="22" font-weight="bold" filter="url(#glow-heavy)">
    ─═★ agent-netx ARCHITECTURE ★═─
  </text>
  <text x="470" y="58" text-anchor="middle" fill="#4a9eff" font-size="11" opacity="0.7">
    v0.2.1  •  Natural-Language Network Toolkit  •  Go + LLM Agent
  </text>

  <!-- ============ LAYER 1: LLM Agent + CLI ============ -->
  <rect x="290" y="75" width="360" height="46" rx="6" fill="none" stroke="#00e5ff" stroke-width="1.5" filter="url(#glow)"/>
  <text x="470" y="103" text-anchor="middle" fill="#00e5ff" font-size="14" font-weight="bold">▸ LLM Agent + CLI (cobra)</text>

  <text x="470" y="140" text-anchor="middle" fill="#4a9eff" font-size="9.5" opacity="0.65">
    start ─ init ─ status ─ ping ─ use ─ sysproxy ─ forward ─ netdiag ─ tui ─ tcpdump
  </text>
  <text x="470" y="153" text-anchor="middle" fill="#4a9eff" font-size="9.5" opacity="0.55">
    proxy ─ dns ─ web ─ tun ─ n2n ─ stunvpv ─ wireguard ─ frp ─ tinc ─ socat ─ corsproxy ─ scp
  </text>

  <line x1="470" y1="165" x2="470" y2="188" stroke="#00e5ff" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>

  <!-- ============ LAYER 2: CORE ============ -->
  <rect x="70" y="193" width="800" height="100" rx="8" fill="none" stroke="#00e676" stroke-width="1.5" opacity="0.5"/>
  <text x="90" y="213" fill="#00e676" font-size="11" font-weight="bold">▼ CORE ENGINE</text>

  <rect x="90" y="223" width="165" height="38" rx="4" fill="none" stroke="#00e676" stroke-width="1"/>
  <text x="172" y="247" text-anchor="middle" fill="#00e676" font-size="11">config.Load()</text>
  <text x="172" y="272" text-anchor="middle" fill="#4a9eff" font-size="9" opacity="0.6">YAML / env / flag</text>

  <rect x="280" y="223" width="165" height="38" rx="4" fill="none" stroke="#00e676" stroke-width="1"/>
  <text x="362" y="247" text-anchor="middle" fill="#00e676" font-size="11">router.Pick()</text>
  <text x="362" y="272" text-anchor="middle" fill="#4a9eff" font-size="9" opacity="0.6">DOMAIN / IP-CIDR / GEOIP / MATCH</text>

  <rect x="470" y="223" width="165" height="38" rx="4" fill="none" stroke="#00e676" stroke-width="1"/>
  <text x="552" y="247" text-anchor="middle" fill="#00e676" font-size="11">proxy.Register()</text>
  <text x="552" y="272" text-anchor="middle" fill="#4a9eff" font-size="9" opacity="0.6">proxy + PacketProxy factory</text>

  <rect x="660" y="223" width="185" height="38" rx="4" fill="none" stroke="#00e676" stroke-width="1"/>
  <text x="752" y="247" text-anchor="middle" fill="#00e676" font-size="11">agent.Tools()</text>
  <text x="752" y="272" text-anchor="middle" fill="#4a9eff" font-size="9" opacity="0.6">gen_config / switch_group / net_connections</text>

  <line x1="255" y1="242" x2="278" y2="242" stroke="#00e676" stroke-width="1" marker-end="url(#arrow-green)" opacity="0.4"/>
  <line x1="445" y1="242" x2="468" y2="242" stroke="#00e676" stroke-width="1" marker-end="url(#arrow-green)" opacity="0.4"/>
  <line x1="635" y1="242" x2="658" y2="242" stroke="#00e676" stroke-width="1" marker-end="url(#arrow-green)" opacity="0.4"/>

  <line x1="470" y1="293" x2="470" y2="315" stroke="#00e676" stroke-width="1.5" marker-end="url(#arrow-green)" opacity="0.6"/>

  <!-- ============ LAYER 3: PROXY PROTOCOLS ============ -->
  <rect x="70" y="320" width="800" height="115" rx="8" fill="none" stroke="#d500f9" stroke-width="1.5" opacity="0.5"/>
  <text x="90" y="340" fill="#d500f9" font-size="11" font-weight="bold">▼ PROXY PROTOCOLS</text>

  <rect x="90" y="350" width="80" height="30" rx="3" fill="none" stroke="#d500f9" stroke-width="1"/>
  <text x="130" y="370" text-anchor="middle" fill="#d500f9" font-size="9.5">HTTP</text>

  <rect x="180" y="350" width="80" height="30" rx="3" fill="none" stroke="#d500f9" stroke-width="1"/>
  <text x="220" y="370" text-anchor="middle" fill="#d500f9" font-size="9.5">HTTPS</text>

  <rect x="270" y="350" width="80" height="30" rx="3" fill="none" stroke="#d500f9" stroke-width="1"/>
  <text x="310" y="370" text-anchor="middle" fill="#d500f9" font-size="9.5">SOCKS5</text>

  <rect x="360" y="350" width="90" height="30" rx="3" fill="none" stroke="#d500f9" stroke-width="1"/>
  <text x="405" y="370" text-anchor="middle" fill="#d500f9" font-size="9.5">Shadowsocks</text>

  <rect x="460" y="350" width="80" height="30" rx="3" fill="none" stroke="#d500f9" stroke-width="1"/>
  <text x="500" y="370" text-anchor="middle" fill="#d500f9" font-size="9.5">Trojan</text>

  <rect x="550" y="350" width="80" height="30" rx="3" fill="none" stroke="#d500f9" stroke-width="1"/>
  <text x="590" y="370" text-anchor="middle" fill="#d500f9" font-size="9.5">VMess</text>

  <rect x="640" y="350" width="100" height="30" rx="3" fill="none" stroke="#d500f9" stroke-width="1"/>
  <text x="690" y="370" text-anchor="middle" fill="#d500f9" font-size="9.5">VLESS+Reality</text>

  <rect x="750" y="350" width="95" height="30" rx="3" fill="none" stroke="#d500f9" stroke-width="1"/>
  <text x="797" y="370" text-anchor="middle" fill="#d500f9" font-size="9.5">HTTP/3 (QUIC)</text>

  <rect x="200" y="392" width="120" height="30" rx="3" fill="none" stroke="#ea80fc" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="260" y="412" text-anchor="middle" fill="#ea80fc" font-size="9.5">selector group</text>

  <rect x="340" y="392" width="120" height="30" rx="3" fill="none" stroke="#ea80fc" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="400" y="412" text-anchor="middle" fill="#ea80fc" font-size="9.5">url-test group</text>

  <rect x="480" y="392" width="120" height="30" rx="3" fill="none" stroke="#ea80fc" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="540" y="412" text-anchor="middle" fill="#ea80fc" font-size="9.5">round-robin</text>

  <rect x="620" y="392" width="120" height="30" rx="3" fill="none" stroke="#ea80fc" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="680" y="412" text-anchor="middle" fill="#ea80fc" font-size="9.5">chain (链式)</text>

  <line x1="470" y1="435" x2="470" y2="458" stroke="#d500f9" stroke-width="1.5" marker-end="url(#arrow-purple)" opacity="0.6"/>

  <!-- ============ LAYER 4: SUBSYSTEMS ============ -->
  <rect x="70" y="463" width="800" height="90" rx="8" fill="none" stroke="#ff9100" stroke-width="1.5" opacity="0.5"/>
  <text x="90" y="483" fill="#ff9100" font-size="11" font-weight="bold">▼ SUBSYSTEMS  ·  TUNNELS  ·  DIAGNOSTICS</text>

  <rect x="90" y="493" width="95" height="38" rx="3" fill="none" stroke="#ff9100" stroke-width="1"/>
  <text x="137" y="515" text-anchor="middle" fill="#ff9100" font-size="9.5">TUN</text>

  <rect x="200" y="493" width="95" height="38" rx="3" fill="none" stroke="#ff9100" stroke-width="1"/>
  <text x="247" y="515" text-anchor="middle" fill="#ff9100" font-size="9.5">n2n P2P</text>

  <rect x="310" y="493" width="95" height="38" rx="3" fill="none" stroke="#ff9100" stroke-width="1"/>
  <text x="357" y="515" text-anchor="middle" fill="#ff9100" font-size="9.5">STUN/TURN</text>

  <rect x="420" y="493" width="95" height="38" rx="3" fill="none" stroke="#ff9100" stroke-width="1"/>
  <text x="467" y="515" text-anchor="middle" fill="#ff9100" font-size="9.5">WireGuard</text>

  <rect x="530" y="493" width="95" height="38" rx="3" fill="none" stroke="#ff9100" stroke-width="1"/>
  <text x="577" y="515" text-anchor="middle" fill="#ff9100" font-size="9.5">forward</text>

  <rect x="640" y="493" width="95" height="38" rx="3" fill="none" stroke="#ff9100" stroke-width="1"/>
  <text x="687" y="515" text-anchor="middle" fill="#ff9100" font-size="9.5">Web · DNS</text>

  <rect x="750" y="493" width="95" height="38" rx="3" fill="none" stroke="#ff9100" stroke-width="1"/>
  <text x="797" y="515" text-anchor="middle" fill="#ff9100" font-size="9.5">mitm · sysproxy</text>

  <line x1="470" y1="553" x2="470" y2="576" stroke="#ff9100" stroke-width="1.5" marker-end="url(#arrow-orange)" opacity="0.6"/>

  <!-- ============ netdiag LAYER ============ -->
  <rect x="70" y="581" width="800" height="65" rx="8" fill="none" stroke="#ff1744" stroke-width="1.5" opacity="0.5"/>
  <text x="90" y="601" fill="#ff1744" font-size="11" font-weight="bold">▼ netdiag  ·  netstat / ss / tcpdump 等价</text>

  <rect x="90" y="611" width="135" height="28" rx="3" fill="none" stroke="#ff1744" stroke-width="1"/>
  <text x="157" y="630" text-anchor="middle" fill="#ff1744" font-size="9.5">GetConnections()</text>

  <rect x="245" y="611" width="135" height="28" rx="3" fill="none" stroke="#ff1744" stroke-width="1"/>
  <text x="312" y="630" text-anchor="middle" fill="#ff1744" font-size="9.5">GetListeners()</text>

  <rect x="400" y="611" width="135" height="28" rx="3" fill="none" stroke="#ff1744" stroke-width="1"/>
  <text x="467" y="630" text-anchor="middle" fill="#ff1744" font-size="9.5">CapturePackets()</text>

  <rect x="555" y="611" width="135" height="28" rx="3" fill="none" stroke="#ff1744" stroke-width="1"/>
  <text x="622" y="630" text-anchor="middle" fill="#ff1744" font-size="9.5">GetStats()</text>

  <rect x="710" y="611" width="135" height="28" rx="3" fill="none" stroke="#ff1744" stroke-width="1"/>
  <text x="777" y="630" text-anchor="middle" fill="#ff1744" font-size="9.5">gopsutil + raw socket</text>

  <text x="90" y="640" fill="#4a9eff" font-size="8.5" opacity="0.6">net_connections</text>
  <text x="245" y="640" fill="#4a9eff" font-size="8.5" opacity="0.6">net_listeners</text>
  <text x="400" y="640" fill="#4a9eff" font-size="8.5" opacity="0.6">net_packet</text>
  <text x="555" y="640" fill="#4a9eff" font-size="8.5" opacity="0.6">net_stats</text>

  <line x1="470" y1="646" x2="470" y2="670" stroke="#ff1744" stroke-width="1.5" marker-end="url(#arrow-red)" opacity="0.6"/>

  <!-- ============ LAYER 5: CLIENT ============ -->
  <rect x="230" y="675" width="480" height="32" rx="16" fill="none" stroke="#ff9100" stroke-width="2" filter="url(#glow)"/>
  <text x="470" y="696" text-anchor="middle" fill="#ff9100" font-size="13" font-weight="bold">
    🌐  APP  →  localhost:7890/7891  │  🤖  LLM Agent  →  config.yml
  </text>
</svg>