<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00b8d4"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#00c853"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d500f9"/>
      <stop offset="100%" stop-color="#aa00ff"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9100"/>
      <stop offset="100%" stop-color="#ff6d00"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-heavy">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#00e5ff" opacity="0.7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="650" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="0.5">
    <line x1="0" y1="50" x2="900" y2="50"/><line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="150" x2="900" y2="150"/><line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="250" x2="900" y2="250"/><line x1="0" y1="300" x2="900" y2="300"/>
    <line x1="0" y1="350" x2="900" y2="350"/><line x1="0" y1="400" x2="900" y2="400"/>
    <line x1="0" y1="450" x2="900" y2="450"/><line x1="0" y1="500" x2="900" y2="500"/>
    <line x1="0" y1="550" x2="900" y2="550"/><line x1="0" y1="600" x2="900" y2="600"/>
    <line x1="100" y1="0" x2="100" y2="650"/><line x1="300" y1="0" x2="300" y2="650"/>
    <line x1="500" y1="0" x2="500" y2="650"/><line x1="700" y1="0" x2="700" y2="650"/>
  </g>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#00e5ff" font-size="22" font-weight="bold" filter="url(#glow-heavy)">
    ─═★ NET-REDIRECT ARCHITECTURE ★═─
  </text>
  <text x="450" y="58" text-anchor="middle" fill="#4a9eff" font-size="11" opacity="0.7">
    v0.1.0  •  Go Proxy Client  •  MIT License
  </text>

  <!-- ============ LAYER 1: CLI ============ -->
  <rect x="300" y="75" width="300" height="40" rx="6" fill="none" stroke="#00e5ff" stroke-width="1.5" filter="url(#glow)"/>
  <text x="450" y="100" text-anchor="middle" fill="#00e5ff" font-size="14" font-weight="bold">▸ CLI Layer (cobra CLI)</text>

  <text x="450" y="132" text-anchor="middle" fill="#4a9eff" font-size="10" opacity="0.6">
    start --proxy ss://...  │  start -c config.yml  │  init  │  status  │  ping  │  use  │  forward
  </text>

  <!-- Arrow -->
  <line x1="450" y1="145" x2="450" y2="170" stroke="#00e5ff" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>

  <!-- ============ LAYER 2: CORE ============ -->
  <rect x="80" y="175" width="740" height="120" rx="8" fill="none" stroke="#00e676" stroke-width="1.5" opacity="0.5"/>
  <text x="100" y="195" fill="#00e676" font-size="11" font-weight="bold">▼ CORE ENGINE</text>

  <!-- Config -->
  <rect x="100" y="205" width="140" height="40" rx="4" fill="none" stroke="#00e676" stroke-width="1"/>
  <text x="170" y="230" text-anchor="middle" fill="#00e676" font-size="11">config.Load()</text>

  <!-- Router -->
  <rect x="280" y="205" width="140" height="40" rx="4" fill="none" stroke="#00e676" stroke-width="1"/>
  <text x="350" y="230" text-anchor="middle" fill="#00e676" font-size="11">router.Pick()</text>

  <!-- Registry -->
  <rect x="460" y="205" width="140" height="40" rx="4" fill="none" stroke="#00e676" stroke-width="1"/>
  <text x="530" y="230" text-anchor="middle" fill="#00e676" font-size="11">proxy.Register()</text>

  <!-- Listener -->
  <rect x="640" y="205" width="140" height="40" rx="4" fill="none" stroke="#00e676" stroke-width="1"/>
  <text x="710" y="230" text-anchor="middle" fill="#00e676" font-size="11">listener.Start()</text>

  <!-- Sub-labels -->
  <text x="170" y="258" text-anchor="middle" fill="#4a9eff" font-size="9" opacity="0.6">YAML → struct</text>
  <text x="350" y="258" text-anchor="middle" fill="#4a9eff" font-size="9" opacity="0.6">DOMAIN/IP-CIDR/GEOIP</text>
  <text x="530" y="258" text-anchor="middle" fill="#4a9eff" font-size="9" opacity="0.6">proxy factory</text>
  <text x="710" y="258" text-anchor="middle" fill="#4a9eff" font-size="9" opacity="0.6">HTTP/SOCKS5 accept</text>

  <!-- Data flow arrows between core components -->
  <line x1="240" y1="225" x2="278" y2="225" stroke="#00e676" stroke-width="1" marker-end="url(#arrow)" opacity="0.4"/>
  <line x1="420" y1="225" x2="458" y2="225" stroke="#00e676" stroke-width="1" marker-end="url(#arrow)" opacity="0.4"/>
  <line x1="600" y1="225" x2="638" y2="225" stroke="#00e676" stroke-width="1" marker-end="url(#arrow)" opacity="0.4"/>

  <!-- Arrow to proxy layer -->
  <line x1="450" y1="300" x2="450" y2="330" stroke="#00e676" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>

  <!-- ============ LAYER 3: PROXY PROTOCOLS ============ -->
  <rect x="80" y="335" width="740" height="130" rx="8" fill="none" stroke="#d500f9" stroke-width="1.5" opacity="0.5"/>
  <text x="100" y="355" fill="#d500f9" font-size="11" font-weight="bold">▼ PROXY PROTOCOLS</text>

  <!-- Protocol boxes - row 1 -->
  <rect x="100" y="365" width="90" height="32" rx="3" fill="none" stroke="#d500f9" stroke-width="1"/>
  <text x="145" y="385" text-anchor="middle" fill="#d500f9" font-size="10">HTTP CONNECT</text>

  <rect x="205" y="365" width="90" height="32" rx="3" fill="none" stroke="#d500f9" stroke-width="1"/>
  <text x="250" y="385" text-anchor="middle" fill="#d500f9" font-size="10">HTTPS CONNECT</text>

  <rect x="310" y="365" width="90" height="32" rx="3" fill="none" stroke="#d500f9" stroke-width="1"/>
  <text x="355" y="385" text-anchor="middle" fill="#d500f9" font-size="10">SOCKS5</text>

  <rect x="415" y="365" width="100" height="32" rx="3" fill="none" stroke="#d500f9" stroke-width="1"/>
  <text x="465" y="385" text-anchor="middle" fill="#d500f9" font-size="10">Shadowsocks</text>

  <rect x="530" y="365" width="90" height="32" rx="3" fill="none" stroke="#d500f9" stroke-width="1"/>
  <text x="575" y="385" text-anchor="middle" fill="#d500f9" font-size="10">Trojan</text>

  <rect x="635" y="365" width="80" height="32" rx="3" fill="none" stroke="#d500f9" stroke-width="1"/>
  <text x="675" y="385" text-anchor="middle" fill="#d500f9" font-size="10">VMess</text>

  <rect x="730" y="365" width="70" height="32" rx="3" fill="none" stroke="#d500f9" stroke-width="1"/>
  <text x="765" y="385" text-anchor="middle" fill="#d500f9" font-size="10">Forward</text>

  <!-- Protocol boxes - row 2: Groups -->
  <rect x="170" y="410" width="120" height="32" rx="3" fill="none" stroke="#ea80fc" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="230" y="430" text-anchor="middle" fill="#ea80fc" font-size="10">Selector Group</text>

  <rect x="310" y="410" width="120" height="32" rx="3" fill="none" stroke="#ea80fc" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="370" y="430" text-anchor="middle" fill="#ea80fc" font-size="10">URLTest Group</text>

  <rect x="450" y="410" width="130" height="32" rx="3" fill="none" stroke="#ea80fc" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="515" y="430" text-anchor="middle" fill="#ea80fc" font-size="10">RoundRobin Group</text>

  <text x="100" y="432" fill="#ea80fc" font-size="9" opacity="0.7">Groups:</text>

  <!-- Arrow to listener -->
  <line x1="450" y1="470" x2="450" y2="500" stroke="#d500f9" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>

  <!-- ============ LAYER 4: LISTENER ============ -->
  <rect x="200" y="505" width="500" height="50" rx="8" fill="none" stroke="#ff9100" stroke-width="1.5" opacity="0.5"/>
  <text x="450" y="525" text-anchor="middle" fill="#ff9100" font-size="12" font-weight="bold">▸ LISTENER PORTS</text>
  <text x="450" y="545" text-anchor="middle" fill="#4a9eff" font-size="10" opacity="0.6">
    HTTP :7890  │  SOCKS5 :7891  │  Forward (dynamic)
  </text>

  <!-- Arrow to client -->
  <line x1="450" y1="560" x2="450" y2="590" stroke="#ff9100" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.6"/>

  <!-- ============ LAYER 5: CLIENT ============ -->
  <rect x="250" y="595" width="400" height="40" rx="20" fill="none" stroke="#ff9100" stroke-width="2" filter="url(#glow)"/>
  <text x="450" y="620" text-anchor="middle" fill="#ff9100" font-size="13" font-weight="bold">
    🌐  BROWSER / APP  →  localhost:7890/7891
  </text>

  <!-- Decorative corner brackets -->
  <text x="15" y="640" fill="#00e5ff" font-size="10" opacity="0.3">┌──────────────────────────────────────────────────────────────────────────────┐</text>
  <text x="15" y="652" fill="#00e5ff" font-size="10" opacity="0.3">│  net-redirect  │  CLI  │  Router  │  Proxy  │  Listener  │  Forward  │</text>
  <text x="825" y="640" fill="#00e5ff" font-size="10" opacity="0.3">│</text>
  <text x="825" y="652" fill="#00e5ff" font-size="10" opacity="0.3">│</text>
</svg>